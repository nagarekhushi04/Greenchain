name: GreenChain CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_build_contracts:
    name: Test & Build Soroban Smart Contracts
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        target: wasm32-unknown-unknown
        components: clippy, rustfmt

    - name: Cache Cargo Dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run Unit Tests
      run: cargo test --workspace

    - name: Compile WASM Smart Contracts
      run: cargo build --target wasm32-unknown-unknown --release

  test_and_build_frontend:
    name: Build & Test Web Client
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend Application
      run: |
        cd frontend
        npm run build

  test_and_build_indexer:
    name: Build & Test Event Indexer
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: indexer/package-lock.json

    - name: Install Indexer Dependencies
      run: |
        cd indexer
        npm ci

    - name: Build & Test Indexer API
      run: |
        cd indexer
        npm run build
        npm test

